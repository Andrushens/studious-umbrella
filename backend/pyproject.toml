[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis crypto wallet security monitor — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20",
    "httpx[http2]>=0.27",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=1.45",
    "tenacity>=8.2",
    "eth-utils>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/aegis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
